<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blur Mode</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>Blur Mode</h1>

  <div class="toggle-row">
    <span id="stateLabel">Status: OFF</span>
    <label class="switch">
      <input id="toggleBtn" type="checkbox">
      <span  class="slider round"></span>
    </label>
  </div>

  <label for="blurAmount">Blur intensity (px)</label>
  <input type="number" id="blurAmount" min="0" max="30" step="1">

  <div class="selector-group">
    <div class="selector-group-title">Elements to apply blur to</div>

    <div class="switch-row">
      <span>Messages</span>
      <label class="switch small">
        <input type="checkbox" id="sel-msg" aria-label="Messages">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="switch-row">
      <span>Conversation</span>
      <label class="switch small">
        <input type="checkbox" id="sel-convheader" aria-label="Conversation">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="switch-row">
      <span>Names</span>
      <label class="switch small">
        <input type="checkbox" id="sel-cellframe" aria-label="Names">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="switch-row">
      <span>Contact Grid</span>
      <label class="switch small">
        <input type="checkbox" id="sel-grid" aria-label="Contact Grid">
        <span class="slider round"></span>
      </label>
    </div>

    <div class="switch-row">
      <span>Images</span>
      <label class="switch small">
        <input type="checkbox" id="sel-img" aria-label="Images">
        <span class="slider round"></span>
      </label>
    </div>
  </div>

  <div class="selector-group">
    <div class="switch-row">
      <span>Auto-enable on WhatsApp Web</span>
      <label class="switch small">
        <input type="checkbox" id="autoEnable" aria-label="Auto-enable on WhatsApp Web">
        <span class="slider round"></span>
      </label>
    </div>
  </div>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="script.js"></script>
</body>
</html>
